<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGL彩色三角形</title>
    <script src="../assets/js/glMatrix-0.9.6.min.js"></script>
</head>
<script>
  let webGL;
  const projMat4 = mat4.create();
  let program;

  // 顶点着色器
  const vertexString = `
        attribute vec4 a_position;
        uniform mat4 proj;
        void main(){
            gl_Position = proj * a_position;
            gl_PointSize = 40.0;
        }`;

  // vec4 gl_FragCoord 该内置变量的第1个和第2个分量表示片元在<canvas>坐标系统（窗口坐标系统）中的坐标值


  // 片元着色器
  const fragmentString = `
        precision mediump float;
        uniform float u_width;
        uniform float u_height;
        void main(){
            gl_FragColor = vec4(gl_FragCoord.x / u_width, 0.0, gl_FragCoord.y / u_height, 1.0);
        }`;

  function init() {
    initWebGL();
    initShader();
    initBuffer();
  }


  function initWebGL() {
    let webGLdiv = document.getElementById('webgl');
    webGL = webGLdiv.getContext('webgl');
    webGL.viewport(0, 0, webGLdiv.clientWidth, webGLdiv.clientHeight);
    mat4.ortho(0, webGLdiv.clientWidth, webGLdiv.clientHeight, 0, -1, 1, projMat4);
  }

  function initShader() {
    // 创建着色器对象（顶点、片元）
    let vsShader = webGL.createShader(webGL.VERTEX_SHADER);
    let fsShader = webGL.createShader(webGL.FRAGMENT_SHADER);

    // 绑定着色器源代码
    webGL.shaderSource(vsShader, vertexString);
    webGL.shaderSource(fsShader, fragmentString);

    // 编译着色器对象
    webGL.compileShader(vsShader);
    webGL.compileShader(fsShader);

    if (!webGL.getShaderParameter(vsShader, webGL.COMPILE_STATUS)) {
      const err = webGL.getShaderInfoLog(vsShader);
      console.log('顶点 =====', err);
      return;
    }
    if (!webGL.getShaderParameter(fsShader, webGL.COMPILE_STATUS)) {
      const err = webGL.getShaderInfoLog(fsShader);
      console.log('片元 =====', err);
      return;
    }

    // 创建程序对象和shader对象进行绑定
    program = webGL.createProgram();
    webGL.attachShader(program, vsShader);
    webGL.attachShader(program, fsShader);

    // webGL和项目中间进行绑定和使用
    webGL.linkProgram(program);
    webGL.useProgram(program);
  }

  function initBuffer() {
    // 创建一个x=100,y=100到x=200,y=200的线
    let triangleArray = [
      100, 600, 0, 1.0,
      400, 100, 0, 1.0,
      800, 600, 0, 1.0
    ];
    let trianglePosition = new Float32Array(triangleArray);
    let aPosition = webGL.getAttribLocation(program, 'a_position');

    let triangleBuffer = webGL.createBuffer();
    webGL.bindBuffer(webGL.ARRAY_BUFFER, triangleBuffer);
    webGL.bufferData(webGL.ARRAY_BUFFER, trianglePosition, webGL.STATIC_DRAW);
    webGL.enableVertexAttribArray(aPosition);
    webGL.vertexAttribPointer(aPosition, 4, webGL.FLOAT, false, 4 * 4, 0);

    let uniformProj = webGL.getUniformLocation(program, 'proj');
    webGL.uniformMatrix4fv(uniformProj, false, projMat4);


    let uniformWidth = webGL.getUniformLocation(program, 'u_width');
    webGL.uniform1f(uniformWidth, 1024.0);

    let uniformHeight = webGL.getUniformLocation(program, 'u_height');
    webGL.uniform1f(uniformHeight, 768.0);

    draw(triangleArray.length / 4);
  }

  function draw(size) {
    webGL.clearColor(0, 0, 0, 1);
    webGL.clear(webGL.COLOR_BUFFER_BIT);
    webGL.drawArrays(webGL.TRIANGLES, 0, size);
  }

</script>


<body onload="init()">
<canvas id="webgl" width="1024" height="768"></canvas>
</body>

</html>
