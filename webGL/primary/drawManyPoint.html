<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGL动态绘制鼠标点击点</title>
    <script src="./glMatrix-0.9.6.min.js"></script>
</head>
<script>
  let webGL;
  const projMat4 = mat4.create();
  let program;

  // 顶点着色器
  const vertexString = `
        attribute vec4 a_position;
        uniform mat4 proj;
        void main(){
            gl_Position = a_position;
            gl_PointSize = 40.0;
        }`;

  // 片元着色器
  const fragmentString = `
        void main(){
            gl_FragColor = vec4(1.0, 0.0, 0.0, 1.0);
        }`;

  function init() {
    initWebGL();
    initShader();
    initBuffer();
    draw();
  }


  function initWebGL() {
    let webGLdiv = document.getElementById('webgl');
    webGL = webGLdiv.getContext('webgl');
    webGL.viewport(0, 0, webGLdiv.clientWidth, webGLdiv.clientHeight);
    mat4.ortho(0, webGLdiv.clientWidth, webGLdiv.clientHeight, 0, -1, 1, projMat4);
  }

  function initShader() {
    // 创建着色器对象（顶点、片元）
    let vsShader = webGL.createShader(webGL.VERTEX_SHADER);
    let fsShader = webGL.createShader(webGL.FRAGMENT_SHADER);

    // 绑定着色器源代码
    webGL.shaderSource(vsShader, vertexString);
    webGL.shaderSource(fsShader, fragmentString);

    // 编译着色器对象
    webGL.compileShader(vsShader);
    webGL.compileShader(fsShader);

    // 创建程序对象和shader对象进行绑定
    program = webGL.createProgram();
    webGL.attachShader(program, vsShader);
    webGL.attachShader(program, fsShader);

    // webGL和项目中间进行绑定和使用
    webGL.linkProgram(program);
    webGL.useProgram(program);
  }


  const POINTS = [];

  function initBuffer() {
    // 创建一个x=100,y=100的点

    let aPosition = webGL.getAttribLocation(program, 'a_position');


    document.addEventListener('mousedown', (e) => {
      // 将canvas的点转换成webGL的点
      const targetX = (e.clientX - 1024 / 2) / (1024 / 2);
      const targetY = (768 / 2 - e.clientY) / (768 / 2);
      console.log(targetX, targetY);

      POINTS.push(targetX);
      POINTS.push(targetY);
      POINTS.push(0);
      POINTS.push(1);

      let pointPosition = new Float32Array(POINTS);

      let pointBuffer = webGL.createBuffer();

      webGL.bindBuffer(webGL.ARRAY_BUFFER, pointBuffer);

      webGL.bufferData(webGL.ARRAY_BUFFER, pointPosition, webGL.STATIC_DRAW);

      webGL.enableVertexAttribArray(aPosition);

      webGL.vertexAttribPointer(aPosition, 4, webGL.FLOAT, false, 4 * 4, 0);

      webGL.vertexAttrib4fv(aPosition, pointPosition);

      let uniformProj = webGL.getUniformLocation(program, 'proj');
      webGL.uniformMatrix4fv(uniformProj, false, projMat4);

      draw();
    });
  }

  function draw() {
    webGL.clearColor(0, 0, 0, 1);
    webGL.clear(webGL.COLOR_BUFFER_BIT | webGL.DEPTH_BUFFER_BIT);
    webGL.drawArrays(webGL.POINTS, 0, POINTS.length);
  }

</script>


<body onload="init()">
<canvas id="webgl" width="1024" height="768"/>
</body>

</html>
