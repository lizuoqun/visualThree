<!DOCTYPE html>
<html>

<head>
    <title>Demo</title>
</head>

<body>
    <h2>服务器配置</h2>
    <label for="ip">IP地址：</label>
    <input type="text" id="ip" name="ip" required>
    <br />
    <label for="port">端口号：</label>
    <input type="number" id="port" name="port" required>
    <br />
    <label for="netmask">子网掩码：</label>
    <input type="text" id="netmask" name="ip" required />
    <br />
    <label for="gateway">网关地址：</label>
    <input type="text" id="gateway" name="ip" required />
    <br /> <br />
    <button id="post">POST请求修改</button>
    <button id="get">GET请求获取</button>

    <br /> <br />
    <!-- 添加结果显示区域 -->
    <div>
        POST请求结果 <div id="postResult" style="margin-top: 20px;"></div>
    </div>
    <br />
    <div>
        GET请求结果 <div id="getResult" style="margin-top: 20px;"></div>
    </div>

    <script>
        document.getElementById('post').addEventListener('click', (e) => {
            e.preventDefault();
            const ip = document.getElementById('ip').value
            const port = document.getElementById('port').value;
            const netmask = document.getElementById('netmask').value;
            const gateway = document.getElementById('gateway').value;
            if (!ip) {
                alert('请填写ip地址')
                return
            }
            if (!port) {
                alert('请填写端口号')
                return
            }
            if (!netmask) {
                alert('请填写子网掩码')
                return
            }
            if (!gateway) {
                alert('请填写网关地址')
                return
            }
            // 收集表单数据
            const formData = {
                ip,
                port,
                netmask,
                gateway
            };

            // 发送 AJAX 请求
            // const postUrl = 'https://api.beidoueyes.cn/api-analysis/notice/pageByAid'
            const postUrl = '/cgi/setNetInfo'
            fetch(postUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(formData)
            })
                .then(response => response.text())
                .then(data => {
                    // 在页面上显示结果而不刷新
                    document.getElementById('postResult').innerHTML = `
                    <p>提交成功！服务器返回：${data}</p>
                `;
                })
                .catch(error => {
                    document.getElementById('postResult').innerHTML =
                        `<p style="color:red">请求失败：${error}</p>`;
                });
        });

        // const getUrl = `https://api.beidoueyes.cn/api-ws/endpoint/info`
        const getUrl = '/cgi/getNetInfo'
        document.getElementById('get').addEventListener('click', () => {
            fetch(getUrl).then(response => response.text())
                .then(data => {
                    // 在页面上显示结果而不刷新
                    document.getElementById('getResult').innerHTML = `
                    <p>提交成功！服务器返回：${data}</p>
                `;
                }).catch(error => {
                    document.getElementById('getResult').innerHTML =
                        `<p style="color:red">请求失败：${error}</p>`;
                });
        });
    </script>
</body>
</html>
